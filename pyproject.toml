[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opc-da-bridge"
version = "0.1.0"
description = "Platform-neutral OPC DA Bridge core and bounded latest-value cache"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "Proprietary"}
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
